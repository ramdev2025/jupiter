<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Jupiter</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231a1a19'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%233987e5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/components.css">
<script>
  // Stamp the theme before first paint so there is no flash. Dark is default.
  document.documentElement.dataset.theme =
    localStorage.getItem("jupiter.theme") || "dark";
</script>
</head>
<body>

<!-- SVG sprite: all icons defined once, referenced by <use href="#ico-NAME"> -->
<svg xmlns="http://www.w3.org/2000/svg" hidden aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
  <defs>
    <symbol id="ico-menu" viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></symbol>
    <symbol id="ico-overview" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></symbol>
    <symbol id="ico-files" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></symbol>
    <symbol id="ico-team" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
    <symbol id="ico-activity" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></symbol>
    <symbol id="ico-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
    <symbol id="ico-alert-triangle" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></symbol>
    <symbol id="ico-alert-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></symbol>
    <symbol id="ico-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></symbol>
    <symbol id="ico-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
    <symbol id="ico-check-circle" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></symbol>
    <symbol id="ico-plus-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></symbol>
    <symbol id="ico-arrow-right" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></symbol>
    <symbol id="ico-inbox" viewBox="0 0 24 24"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol>
    <symbol id="ico-bell" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></symbol>
    <symbol id="ico-file-text" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></symbol>
    <symbol id="ico-pencil" viewBox="0 0 24 24"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></symbol>
    <symbol id="ico-eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="ico-git-merge" viewBox="0 0 24 24"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/></symbol>
  </defs>
</svg>

<!-- ===================================================================== -->
<!-- Onboarding shell - centred, no chrome. Pages render into #setup-view. -->
<!-- ===================================================================== -->
<div id="shell-setup" class="shell-setup" hidden>
  <div class="setup-frame">
    <header class="setup-head">
      <a class="brand" href="#/welcome">
        <span class="brand-dot" aria-hidden="true"></span>Jupiter
      </a>
      <button class="ghost" id="setup-theme" title="Toggle light / dark">Theme</button>
    </header>

    <ol class="stepper" id="stepper" aria-label="Setup progress" hidden></ol>

    <main id="setup-view" class="setup-view" tabindex="-1"></main>
  </div>
</div>

<!-- ===================================================================== -->
<!-- App shell - topbar + sidebar. Pages render into #app-view.            -->
<!-- ===================================================================== -->
<div id="shell-app" class="shell-app" hidden>

  <header class="topbar">
    <button class="ghost icon only-narrow" id="btn-nav" aria-label="Toggle navigation"
            aria-expanded="false"><svg class="ico" aria-hidden="true"><use href="#ico-menu"/></svg></button>

    <a class="brand" href="#/overview">
      <span class="brand-dot" aria-hidden="true"></span>Jupiter
    </a>

    <span class="chip" id="chip-org" title="Team"></span>

    <span class="spacer"></span>

    <span class="chip live" id="chip-live">
      <span class="pulse" aria-hidden="true"></span><span id="live-text">connecting…</span>
    </span>
    <button class="ghost" id="btn-pause" aria-pressed="false"
            title="Pause / resume polling">Pause</button>
    <button class="ghost" id="btn-theme" title="Toggle light / dark">Theme</button>
    <span class="chip who" id="chip-me"></span>
  </header>

  <div class="body">
    <nav class="sidebar" id="sidebar" aria-label="Sections">
      <a href="#/overview" data-nav="overview">
        <svg class="ico" aria-hidden="true"><use href="#ico-overview"/></svg>
        <span class="label">Overview</span>
      </a>
      <a href="#/files" data-nav="files">
        <svg class="ico" aria-hidden="true"><use href="#ico-files"/></svg>
        <span class="label">Files</span>
        <span class="nav-badge" id="nav-badge-files" hidden></span>
      </a>
      <a href="#/team" data-nav="team">
        <svg class="ico" aria-hidden="true"><use href="#ico-team"/></svg>
        <span class="label">Team</span>
        <span class="nav-count" id="nav-count-team"></span>
      </a>
      <a href="#/activity" data-nav="activity">
        <svg class="ico" aria-hidden="true"><use href="#ico-activity"/></svg>
        <span class="label">Activity</span>
      </a>
      <span class="nav-sep" aria-hidden="true"></span>
      <a href="#/settings" data-nav="settings">
        <svg class="ico" aria-hidden="true"><use href="#ico-settings"/></svg>
        <span class="label">Settings</span>
      </a>

      <div class="sidebar-foot">
        <span class="muted" id="foot-version"></span>
        <a href="/docs" target="_blank" rel="noopener">API docs</a>
      </div>
    </nav>

    <main id="app-view" class="app-view" tabindex="-1"></main>
  </div>
</div>

<div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
<div id="tip" class="tip" role="tooltip" hidden></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
